<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163b68"><title>みらい銀行｜学習用</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#1d2d40;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}.top{background:#163b68;color:white;padding:18px 18px 15px}.top small{display:block;color:#d3e2f0;font-size:11px}.brand{font-size:20px;font-weight:750}.wrap{max-width:520px;margin:auto}.content{padding:16px;padding-bottom:85px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 1px 5px #1c365015}.muted{color:#60748b;font-size:13px}.balance{font-size:36px;font-weight:800;letter-spacing:-1px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:white;border:0;border-radius:15px;padding:23px 8px;color:#163b68;font-size:15px;font-weight:700;box-shadow:0 1px 5px #1c365015;cursor:pointer}.tile .ico{display:block;font-size:28px;margin-bottom:9px}.btn{border:0;border-radius:11px;padding:14px 16px;background:#18528c;color:white;font-weight:700;font-size:16px;cursor:pointer;width:100%}.btn.secondary{background:#e9f0f7;color:#163b68}.btn.danger{background:#a73838}.btn:disabled{opacity:.4;cursor:not-allowed}.btnrow{display:flex;gap:10px}.btnrow>*{flex:1}.back{border:0;background:transparent;color:#18528c;padding:8px 0 15px;font-weight:700;font-size:15px}.field{display:block;font-size:14px;font-weight:700;margin:14px 0 8px}input{font:inherit;border:1.5px solid #a6b6c7;border-radius:10px;width:100%;padding:15px;font-size:21px;background:white;color:#1d2d40}input:focus{outline:3px solid #bdd7ee}.tabs{display:flex;gap:8px}.tab{flex:1;padding:14px 4px;border-radius:10px;border:1px solid #cbd9e6;background:white;color:#1c4c78;font-weight:700;font-size:15px}.tab.active{background:#1a578f;color:white}.alert{color:#a02828;font-weight:700;font-size:14px;margin:10px 0}.success{color:#176b45}.line{border-bottom:1px solid #e4ebf1;padding:13px 0}.foot{position:fixed;bottom:0;left:0;right:0;background:#163b68;color:#dce8f2;font-size:11px;text-align:center;padding:11px}.label{display:inline-block;background:#e7eff8;color:#194b7d;padding:4px 9px;border-radius:50px;font-size:11px}.notice{background:#fff7e5;border:1px solid #eed8a6;border-radius:10px;padding:12px;font-size:13px;line-height:1.7}.smallbtn{border:0;background:none;color:#18528c;font-weight:700;font-size:13px;padding:5px}.center{text-align:center}.bigicon{font-size:46px}.space{height:8px}h2{font-size:20px;margin:0 0 16px}p{line-height:1.7}.hide{display:none}</style></head><body><div class="wrap"><header class="top"><div class="row"><div><div class="brand">▣ みらい銀行</div><small>MIRAI BANK</small></div><span class="label">学習用・架空</span></div></header><main id="app" class="content"></main></div><div class="foot">これは学習用の架空の銀行です。実際のお金は動きません。</div><script>
(()=>{'use strict';const KEY='mirai_bank_lesson_v1';const PIN='4826';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Number.isSafeInteger(data.balance)||!Array.isArray(data.history))data={balance:0,history:[]};let page='home',type='withdraw',amount='',salary='30000',pin='',staff=false,error='',confirm='',last=null;const $=document.getElementById('app');const yen=n=>Number(n).toLocaleString('ja-JP')+'円';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){error='保存できません。ブラウザの保存設定を確認してください。';return false}}function nav(p){page=p;error='';confirm='';amount='';render()}function valid(v){return /^\d+$/.test(v)&&Number.isSafeInteger(Number(v))&&Number(v)>0&&Number(v)<=10000000}function record(label,delta){const next=data.balance+delta;if(next<0||!Number.isSafeInteger(next)){error='取引できません。';render();return}data.balance=next;data.history.unshift({label,delta,after:next,at:new Date().toLocaleString('ja-JP')});save();last={label,delta};page='done';confirm='';amount='';render()}function historyRows(items){return items.length?items.map(h=>`<div class="line row"><div><b>${esc(h.label)}</b><div class="muted">${esc(h.at||'授業中')}<br>取引後残高 ${yen(h.after)}</div></div><b class="${h.delta>0?'success':''}">${h.delta>0?'+':'−'}${yen(Math.abs(h.delta))}</b></div>`).join(''):'<p class="muted">まだ取引はありません。</p>'}function render(){let html='';if(page==='home'){html=`<section class="card"><div class="row"><span class="muted">普通預金　123-4567（架空）</span><span>▣</span></div><div class="muted" style="margin-top:20px">現在の残高</div><div class="balance">${yen(data.balance)}</div><div class="muted">最終取引：${data.history.length?esc(data.history[0].label):'まだ取引はありません'}</div></section><div class="actions"><button class="tile" data-go="history"><span class="ico">▤</span>入出金明細</button><button class="tile" data-go="atm"><span class="ico">▣</span>ATM体験</button></div><div class="space"></div><section class="card"><div class="row"><b>最近のお取引</b><button class="smallbtn" data-go="history">すべて見る ›</button></div>${historyRows(data.history.slice(0,3))}</section><button class="btn secondary" data-go="menu">☰ メニュー・設定</button>`}else if(page==='history'){html=`<button class="back" data-go="home">← ホームに戻る</button><section class="card"><h2>入出金明細</h2><div class="muted">現在の残高</div><div class="balance" style="font-size:28px">${yen(data.balance)}</div>${historyRows(data.history)}</section>`}else if(page==='atm'){html=`<button class="back" data-go="home">← ホームに戻る</button><section class="card"><h2>ATM体験</h2><div class="notice">ここはATMの操作を再現する画面です。現金の受け渡しは職員と確認してください。</div><div class="space"></div><div class="tabs"><button class="tab ${type==='withdraw'?'active':''}" data-type="withdraw">お引き出し</button><button class="tab ${type==='deposit'?'active':''}" data-type="deposit">お預け入れ</button></div><p class="muted">口座残高：${yen(data.balance)}</p><label class="field" for="amount">${type==='withdraw'?'引き出す':'預ける'}金額（円）</label><input id="amount" type="number" inputmode="numeric" min="1000" step="1000" placeholder="例：5000" value="${esc(amount)}"><p class="muted">1,000円単位で入力してください。</p>${error?`<p class="alert">${esc(error)}</p>`:''}${confirm==='atm'?`<div class="notice"><b>取引内容を確認</b><p>${type==='withdraw'?'お引き出し':'お預け入れ'}：${yen(Number(amount))}</p><div class="btnrow"><button class="btn secondary" data-act="cancel">戻る</button><button class="btn" data-act="execute-atm">実行する</button></div></div>`:'<button class="btn" data-act="check-atm">確認する</button>'}</section>`}else if(page==='menu'){html=`<button class="back" data-go="home">← ホームに戻る</button><section class="card"><h2>メニュー・設定</h2><b>🔒 職員専用メニュー</b><p class="muted">お給料の振り込み、授業データのリセット</p><button class="btn secondary" data-go="${staff?'staff':'login'}">職員専用画面を開く</button></section>`}else if(page==='login'){html=`<button class="back" data-go="menu">← 戻る</button><section class="card"><div class="center bigicon">🔒</div><h2 class="center">職員専用</h2><p class="muted center">職員用コードを入力してください。</p><label class="field" for="pin">4桁のコード</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(pin)}">${error?`<p class="alert">${esc(error)}</p>`:''}<div class="space"></div><button class="btn" data-act="login">ロックを解除</button></section>`}else if(page==='staff'){html=`<div class="row"><button class="back" data-go="home">← ホーム</button><button class="smallbtn" data-act="lock">🔒 ロックする</button></div><section class="card"><h2>職員用管理画面</h2><div class="muted">現在の残高</div><div class="balance" style="font-size:28px">${yen(data.balance)}</div><hr style="border:0;border-top:1px solid #e4ebf1"><b>お給料の振り込み</b><label class="field" for="salary">振り込み金額（円）</label><input id="salary" type="number" inputmode="numeric" min="1" value="${esc(salary)}">${error?`<p class="alert">${esc(error)}</p>`:''}${confirm==='salary'?`<div class="notice"><b>${yen(Number(salary))}を振り込みますか？</b><div class="space"></div><div class="btnrow"><button class="btn secondary" data-act="cancel">戻る</button><button class="btn" data-act="execute-salary">振り込む</button></div></div>`:'<button class="btn" data-act="check-salary">振り込みを確認</button>'}<hr style="border:0;border-top:1px solid #e4ebf1;margin:22px 0"><b>授業データのリセット</b><p class="muted">口座残高を0円に戻し、取引履歴を消します。</p>${confirm==='reset'?'<div class="notice"><b>すべての取引を消しますか？</b><div class="space"></div><div class="btnrow"><button class="btn secondary" data-act="cancel">キャンセル</button><button class="btn danger" data-act="execute-reset">消去する</button></div></div>':'<button class="btn danger" data-act="check-reset">データをリセット</button>'}</section>`}else if(page==='done'){html=`<section class="card center"><div class="bigicon success">✓</div><h2>お取引が完了しました</h2><p>${esc(last?.label||'取引')}</p><div class="muted">取引後の残高</div><div class="balance" style="font-size:30px">${yen(data.balance)}</div><button class="btn" data-go="home">ホームに戻る</button></section>`}$.innerHTML=html}$.addEventListener('input',e=>{if(e.target.id==='amount'){amount=e.target.value;error='';confirm=''}if(e.target.id==='pin')pin=e.target.value;if(e.target.id==='salary'){salary=e.target.value;error='';confirm=''}});$.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){nav(b.dataset.go);return}if(b.dataset.type){type=b.dataset.type;error='';confirm='';amount='';render();return}const a=b.dataset.act;if(a==='cancel'){confirm='';render()}else if(a==='check-atm'){if(!valid(amount)||Number(amount)%1000!==0)error='1,000円単位で金額を入力してください。';else if(type==='withdraw'&&Number(amount)>data.balance)error='残高が足りません。';else{error='';confirm='atm'}render()}else if(a==='execute-atm'){if(!valid(amount)||Number(amount)%1000!==0||type==='withdraw'&&Number(amount)>data.balance){error='金額を確認してください。';confirm='';render()}else record(type==='withdraw'?'ATM お引き出し':'ATM お預け入れ',(type==='withdraw'?-1:1)*Number(amount))}else if(a==='login'){if(pin===PIN){staff=true;pin='';nav('staff')}else{error='コードが違います。';pin='';render()}}else if(a==='lock'){staff=false;pin='';nav('home')}else if(a==='check-salary'){if(!valid(salary)){error='正しい金額を入力してください。';render()}else{confirm='salary';error='';render()}}else if(a==='execute-salary'){if(!staff||!valid(salary)){error='操作できません。';render()}else{staff=false;record('お給料の振り込み',Number(salary))}}else if(a==='check-reset'){confirm='reset';render()}else if(a==='execute-reset'){if(staff){data={balance:0,history:[]};save();staff=false;pin='';nav('home')}}});render()})();
</script></body></html>
